[package]
name = "glazebar-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"

[dependencies]
gif = "0.14.2"
anyhow = "1.0.102"
base64 = "0.22.1"
tempfile = "3.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = "0.4.45"
ureq = { version = "2.12.1", default-features = false, features = ["native-tls"] }
native-tls = "0.2.18"
url = "2.5.8"
tungstenite = "0.28.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
resvg = { version = "0.47.0", default-features = false }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Com_StructuredStorage", "Win32_System_Wmi", "Win32_Security", "Win32_Security_Cryptography"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_Devices_DeviceAndDriverInstallation", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis", "Win32_Security", "Win32_Security_Cryptography"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
